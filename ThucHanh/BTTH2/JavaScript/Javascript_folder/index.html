        <h3 id="id_document">- Lấy thành phần của 1 node</h3>
        <script>
            var node = document.getElementById("id_document");
            with (document) {
                write("nodeName: " + node.nodeName + "<br>");
                write("nodeType: " + node.nodeType + "<br>");
                write("nodeValue: " + node.nodeValue + "<br>");
                write("innerText: " + node.innerText + "<br>");
            }
        </script>

        <h1>Tạo 1 table bằng javascript</h1>
        
        <script>
            function createTable(divTable){
                var tagTable = document.createElement("table");
                tagTable.border = 1;
                var nDong = frm.txtdong.value;
                var nCot = frm.txtcot.value;
                for (i = 0; i < nDong; i++){
                    var tr = document.createElement("tr");

                    for (j = 0; j < nCot; j++) {
                        var td = document.createElement("td");
                        var textTd = document.createTextNode(i+""+j);
                        td.appendChild(textTd);
                        tr.appendChild(td);
                    }
                    tagTable.appendChild(tr);
                }
                divTable.appendChild(tagTable); 
            }
        </script>

        <form name="frm">
            Số dòng: <input type="text" name="txtdong"><br>
            Số cột: <input type="text" name="txtcot"><br>
            <input type="button" name="taoTable" value="Tao table"
            onclick="createTable(document.getElementById('divTable'))">
        </form>

        <div id="divTable"></div>
