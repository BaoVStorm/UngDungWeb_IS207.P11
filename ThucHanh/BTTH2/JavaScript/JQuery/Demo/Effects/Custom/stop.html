<!DOCTYPE html>
<html>
<head>
  <script src="../../jquery.js"></script>

  <style>
    body {
      padding: 0;
      margin: 0;
    }

  </style>

  <script> 
    $(document).ready(function(){
      var maxWidth = "100%";
      var maxHeight = "100rem";

      // alert("maxWidth: " + maxWidth);

      $("#start").click(function(){
        $("div").animate({height: maxHeight, width: maxWidth},2000);
        // $("div").animate({width:0},1000);
      });
      $("#stop").click(function(){
        $("div").stop();
      });
    });
  </script> 
</head>

<body>
  <!-- <div id="block"  style="background-color: red; height: 100em; width: 100px;"></div> -->

  <p>
  <button id="start">Start Animation</button>
  <button id="stop">Stop Current Animation</button>
  </p>

  <div style="background:#98bf21;height:100px;width:100px">
  </div>
 
</body>
</html>
