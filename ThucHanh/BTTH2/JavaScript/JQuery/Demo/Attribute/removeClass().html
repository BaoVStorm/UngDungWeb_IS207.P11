<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>Untitled Document</title>

  <style>
    p{
      margin:10px; font-size: 20px; font-weight:bold;
    }
    .red {color:red;}
    .under { text-decoration: underline;}
    .highlight { background:#0F6}

  </style>
  
  <script src="http://code.jquery.com/jquery-latest.js"></script>
</head>

<body>
  <p class="red under">Van Lam</p>
  <p class="red under highlight">Tran Chung</p>
  <p class="red under">Viet Ha</p>
  <p class="red under">a Team</p>

  <script>$("p:odd").removeClass("red under");</script>

</body>
</html>
