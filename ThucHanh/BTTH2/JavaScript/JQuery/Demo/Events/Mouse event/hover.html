<!DOCTYPE html>
<html>
<head>
<script src="../../jquery.js"></script>
<script>
$(document).ready(function(){
  $("p").hover(function(){
    $("p").css("background-color","yellow");
    },function(){
    $("p").css("background-color","#E9E9E4");
  });
});
</script>
</head>
<body>
<p style="background-color:#E9E9E4">Hover the mouse pointer over this paragraph.</p>
</body>
</html>
