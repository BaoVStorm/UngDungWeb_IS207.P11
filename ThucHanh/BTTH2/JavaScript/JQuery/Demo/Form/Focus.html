<!DOCTYPE html>
<html>
<head>
<script src="../jquery.js"></script>
<script>
$(document).ready(function(){
  $("input").focus(function(){
    $("span").css("display","inline").fadeOut(2000);
  });
});
</script>
<style>
span
{
display:none;
}
</style>
</head>
<body>

<input>
<span>Can I have you phone number?</span>
<p>Click in the input field to get focus.</p>

</body>
</html>
