<!DOCTYPE html>
<html>
<head>
	<script src="../jquery.js"></script>
	
	<script>
		$(document).ready(function(){
			$("button").click(function(){
			var bang=$("<table border='1'></table>");
			tong=0;
			for(i=1;i<=3;i++)
			{
				dong=$("<tr></tr>");
				for(j=1;j<=4;j++)
				{	tong++;
					cot=$("<td></td>").text(tong);
					dong.append(cot);
				}
				bang.append(dong);
			}
			$("#content").empty();
			$("#content").append(bang);       
			});
		});
	</script>
</head>

<body>
	<p>This is a paragraph.</p>
	
	<button>Append text</button>
	
	<div id="content"></div>
</body>
</html>
