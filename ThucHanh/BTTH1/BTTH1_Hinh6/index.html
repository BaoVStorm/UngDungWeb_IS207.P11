<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>BTTH1_6</title>
        <link rel="stylesheet" href="BTTH1_6.css" type="text/css">
    </head>

    <body>
        <div id="container">
            <h1 align="center" >Phiếu đăng ký tham gia dự thưởng</h1>

            <table border="1" align="center">
                <tr >
                    <td class="title">
                        <label class="row" for="fullName">Họ và tên</label>
                    </td>
                    <td class="content" colspan="2">
                        <input type="text" class="row" id="fullName" placeholder="Nguyễn Văn A">
                    </td>
                </tr>

                <tr>
                    <td class="title">
                        <label for="location">Địa chỉ</label>
                    </td>
                    <td class="content" colspan="2">
                        <input type="text" class="row" id="location" placeholder="abc, xyz, jqk">
                    </td>
                </tr>

                <tr>
                    <td class="title">
                        <label class="row" for="phone">Điện thoại</label>
                    </td>
                    <td class="content" colspan="2">
                        <input type="text" class="row" id="phone" placeholder="09xxxxxxxx">
                    </td>
                </tr>
                
                <tr>
                    <td class="title">
                        <label class="row" for="gender">Phái</label>
                    </td>
                    <td class="content" colspan="2">
                        <div id="gender">
                            <input type="radio" class="row" name="gender" checked> Nam
                            <input type="radio" class="row" name="gender"> Nữ
                        </div>
                    </td>
                </tr>

                <tr>
                    <td class="title">
                        <label class="row" for="product">Sản phẩm</label>
                    </td>
                    <td class="content" colspan="2">
                        <input type="textarea" class="row" id="prodcut">
                    </td>
                </tr>                
                
                <tr>
                    <td class="title">
                        <label class="row" for="guestNumber">Số dự đoán</label>
                    </td>
                    <td class="content row" colspan="2">
                        ádfasdf
                    </td>
                </tr>

                <tr>
                    <td id="button" colspan="3">
                        <input type="button" value="Đăng ký">
                    </td>
                </tr>
            </table>
        </div>
    </body>
</html>
