<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy tính đơn giản</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .calculator {
            width: 300px;
            background-color: #A7D8EB;
            padding: 20px;
            border-radius: 8px;
            margin: 100px auto;
        }
        .calculator h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        .calculator label {
            display: block;
            margin-bottom: 10px;
        }
        .calculator input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .calculator input[type="button"] {
            width: 60px;
            padding: 10px;
            margin-right: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Máy tính</h2>
    <label for="number1">Số thứ nhất</label>
    <input type="text" id="number1" placeholder="Nhập số thứ nhất">

    <label for="number2">Số thứ hai</label>
    <input type="text" id="number2" placeholder="Nhập số thứ hai">

    <div>
        <input type="button" value="Cộng">
        <input type="button" value="Trừ">
        <input type="button" value="Nhân">
        <input type="button" value="Chia">
    </div>

    <div class="result">
        <label for="result">Kết quả</label>
        <input type="text" id="result" readonly>
    </div>
</div>

</body>
</html>
