<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Example</title>
    

    <link rel="stylesheet" type="text/css" href="BTTH1_9.css">
</head>

<body>
    <header>
        <h1>Tiêu đề Trang</h1>
        <nav>
            <ul>
                <li><a href="#home">Trang chủ</a></li>
                <li>
                    <a href="#about">Giới thiệu</a>
                    <div class="submenu">
                        <ul>
                            <li><a href="#book-car">Đặt xe</a></li>
                            <li><a href="#book-flight">Đặt máy bay</a></li>
                            <li><a href="#refund">Trả vé</a></li>
                        </ul>
                    </div>
                </li>
                <li id="header">
                    <a href="#services">Dịch vụ</a>
                    <div class="submenu">
                        <ul>
                            <li><a href="#book-car">111</a></li>
                            <li><a href="#book-flight">222</a></li>
                            <li><a href="#refund">333</a></li>
                        </ul>
                    </div>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Chào mừng bạn đến với trang web của chúng tôi!</h2>
        <p>Đây là một ví dụ về header với các mục tương tác.</p>
    </main>
</body>
</html>
